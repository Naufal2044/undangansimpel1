<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bismillahGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="30%" stop-color="#FBF5B7"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E5631" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Decorative Frame Flourish -->
    <path d="M 100,100 C 150,40 450,40 500,100 C 450,160 150,160 100,100 Z" fill="none" stroke="url(#bismillahGold)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="300" cy="30" r="4" fill="url(#bismillahGold)"/>
    <circle cx="300" cy="170" r="4" fill="url(#bismillahGold)"/>
    
    <!-- Arabic Calligraphy Text -->
    <text x="50%" y="115" text-anchor="middle" font-family="'Scheherazade New', 'Amiri', 'Traditional Arabic', serif" font-size="58" font-weight="bold" fill="url(#bismillahGold)" letter-spacing="2">
      بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </text>
  </g>
</svg>
