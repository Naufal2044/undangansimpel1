<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="dress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3EFE6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="30" fill="url(#bgGrad)"/>

  <!-- Islamic Dome Arch Border -->
  <path d="M 50,500 L 50,200 Q 50,60 200,60 Q 350,60 350,200 L 350,500 Z" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>

  <!-- Bride Illustration Vector -->
  <!-- Veil / Hijab -->
  <path d="M 200,100 C 130,100 120,200 120,380 L 280,380 C 280,200 270,100 200,100 Z" fill="url(#dress)" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M 200,100 C 145,100 140,180 140,280 C 170,300 230,300 260,280 C 260,180 255,100 200,100 Z" fill="#FFFFFF" shadow="0 4px 10px rgba(0,0,0,0.05)"/>
  
  <!-- Crown / Tiara Ornament -->
  <path d="M 175,135 L 185,115 L 200,130 L 215,115 L 225,135 Z" fill="url(#gold)"/>
  <circle cx="185" cy="115" r="3" fill="#FFF"/>
  <circle cx="200" cy="125" r="4" fill="#FFF"/>
  <circle cx="215" cy="115" r="3" fill="#FFF"/>

  <!-- Face Outline & Features -->
  <ellipse cx="200" cy="190" rx="42" ry="52" fill="#FDF0E6"/>
  <!-- Eyes -->
  <path d="M 175,190 Q 185,182 192,190" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 208,190 Q 215,182 225,190" stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 192,215 Q 200,222 208,215" stroke="#E53E3E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="172" cy="205" rx="8" ry="5" fill="#FEB2B2" opacity="0.6"/>
  <ellipse cx="228" cy="205" rx="8" ry="5" fill="#FEB2B2" opacity="0.6"/>

  <!-- Flower Bouquet -->
  <g transform="translate(160, 310)">
    <circle cx="20" cy="20" r="14" fill="#52B788"/>
    <circle cx="35" cy="15" r="16" fill="#F7E7B4"/>
    <circle cx="15" cy="35" r="15" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="38" cy="35" r="14" fill="#1E5631"/>
  </g>
</svg>
